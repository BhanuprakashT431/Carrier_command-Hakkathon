services:
  # Node.js Backend Service
  - type: web
    name: ccc-backend
    env: node
    buildCommand: "cd backend && npm install && npx prisma generate"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "postgresql://user:pass@host:5432/db" # REPLACE in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://your-vercel-frontend-url.vercel.app" # REPLACE in Render dashboard

  # Python Agents Service
  - type: web
    name: ccc-agents
    env: python
    buildCommand: "cd agents && pip install -r requirements.txt"
    startCommand: "cd agents && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: "https://your-vercel-frontend-url.vercel.app" # REPLACE in Render dashboard
